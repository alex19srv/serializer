name: build and test
on:
  push:
    branches: [develop, main]
env:
  GO_VERSION: "1.27"

jobs:
  build_and_test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-26.04-arm
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout serializer code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download go dependencies
        run: go mod download

      - name: Setup just
        uses: extractions/setup-just@v3

      - name: run tests
        run: |
          just generate test
