name: build and test
on:
  push:
    branches: [develop, main]
env:
  GO_VERSION: "1.27"

jobs:
  build_and_test:
    runs-on:
      # - ubuntu-latest
     - ubuntu-26.04-arm
    steps:
      - name: Checkout serializer code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ./go.sum

      - name: Download go dependencies
        run: go mod download

      - name: Setup just
        uses: extractions/setup-just@v3

      - name: run tests
        run: |
          just generate test
